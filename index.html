<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Звіт за зміну</title>
<meta name="theme-color" content="#1f5eff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Звіт">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/*
VOICE: робочий інструмент, швидкий, без зайвого
IDEA: бланк звіту, який заповнюється натисканнями
PICTURE: сама форма і живий готовий текст під нею
COLOUR and TYPE: білий/графіт, акцент насичений синій, Onest
LAYOUT: одна колонка, великі кнопки під палець, липка кнопка «Копіювати»
*/
:root{color-scheme:light dark;--bg:light-dark(#f4f5f7,#0f1115);--card:light-dark(#fff,#181b21);--ink:light-dark(#14161a,#eef0f3);--mute:light-dark(#6b7280,#9aa1ad);--line:light-dark(#e3e6ea,#2a2f38);--acc:#1f5eff;--acc2:light-dark(#e8efff,#1b2647);--ok:light-dark(#11804a,#3ccf86)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Onest,system-ui,sans-serif;overflow-x:clip}
main{max-width:620px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 130px max(14px,env(safe-area-inset-left))}
h1{font-size:30px;line-height:1.05;margin:8px 4px 16px;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.lbl{font-weight:700;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.lbl small{font-weight:500;color:var(--mute);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
button,.chip{font:inherit;color:inherit;cursor:pointer}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.chip.added{background:var(--acc2);border-color:var(--acc)}
.chip .x{font-weight:800;color:#d33}
.chip.ghost{border-style:dashed;color:var(--mute)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input{font:inherit;font-size:16px;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;min-height:44px;padding:0 12px;width:100%}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--acc);color:#fff;font-weight:700}
.btn.sec{background:var(--acc2);color:var(--ink)}
.link{background:none;border:0;color:var(--acc);font-weight:600;padding:6px 0;font-size:14px}
.w{border-top:1px solid var(--line);padding:12px 0}
.w:first-child{border-top:0;padding-top:0}
.wh{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:700}
.wh button{border:0;background:none;color:var(--mute);font-size:22px;width:44px;height:44px}
.cnt{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.tl{font-size:14px;color:var(--mute);font-weight:600;margin-top:10px}
.tl+.cnt{margin-top:4px}
.bx{font-size:13px;color:var(--mute);white-space:nowrap;flex-basis:100%}
.cnt input{width:80px;text-align:center;font-weight:700;font-size:20px}
.cnt .pm{width:52px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-size:15px;font-weight:700}
.types{margin-top:8px}
.types .chip{min-height:38px;font-size:14px}
.tot{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center}
.tot b{font-size:22px;text-align:right;white-space:nowrap}
.tot input{max-width:120px;justify-self:end;text-align:center;font-weight:700}
.empty{color:var(--mute);font-size:15px}
pre{white-space:pre-wrap;font:15px/1.5 Onest,system-ui,sans-serif;margin:0;background:var(--bg);border-radius:12px;padding:12px;overflow-wrap:anywhere}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.bar div{max-width:620px;margin:0 auto;display:flex;gap:8px}
.bar .btn{flex:1;font-size:17px;min-height:52px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<main>
<h1>Звіт за зміну</h1>

<section class="card">
<p class="lbl">Локація 📍 <button class="link" id="editLoc">змінити список</button></p>
<div class="chips" id="locs"></div>
<div class="addrow" id="locAdd" hidden><input id="locIn" placeholder="Нова локація"><button class="btn" id="locBtn">Додати</button></div>
</section>

<section class="card">
<p class="lbl">Дата 📅</p>
<div class="chips"><button class="chip" id="dToday">Сьогодні</button><button class="chip" id="dYest">Вчора</button></div>
<div class="addrow"><input type="date" id="date"></div>
</section>

<section class="card">
<p class="lbl">Зміна 🧢</p>
<div class="chips" id="shifts"></div>
</section>

<section class="card">
<p class="lbl">Типи <button class="link" id="editType">змінити список</button></p>
<div class="chips" id="types"></div>
<div class="addrow"><input id="typeIn" placeholder="Напр. 50 км"><button class="btn sec" id="typeBtn">Додати</button></div>
</section>

<section class="card">
<p class="lbl">Працівники <button class="link" id="editPpl">змінити список</button></p>
<div class="chips" id="roster"></div>
<div class="addrow"><input id="pplIn" placeholder="Прізвище І. Б."><button class="btn sec" id="pplBtn">Додати</button></div>
</section>

<section class="card">
<p class="lbl">Зібрано ✅</p>
<div id="rows"></div>
</section>

<section class="card">
<p class="lbl">Підсумки</p>
<div id="totals"></div>
</section>

<section class="card">
<p class="lbl">Готовий текст <button class="link" id="reset">нова зміна</button></p>
<pre id="out"></pre>
</section>
</main>

<div class="bar"><div><button class="btn sec" id="copy">Скопіювати</button><button class="btn" id="share">Надіслати</button></div></div>
<div class="toast" id="toast">Скопійовано</div>

<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SHIFTS=['денна','нічна № 1','нічна № 2'];
const KEY='zvit-v1';
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
let S={locs:[],loc:'',date:iso(new Date()),shift:'денна',types:['30 км'],roster:[],rows:[],packed:{}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)S=Object.assign(S,s)}catch(e){}
S.rows=S.rows.map(r=>typeof r.n==='object'&&r.n?r:{name:r.name,n:r.type?{[r.type]:r.n||''}:{}});
let editLoc=false,editPpl=false,editType=false;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

function fmtDate(v){if(!v)return'';const[y,m,d]=v.split('-');return`${d}.${m}.${y}`}
function totals(){const t={};S.types.forEach(k=>t[k]=0);S.rows.forEach(r=>{for(const k in r.n)if(k in t)t[k]+=(+r.n[k]||0)});return t}
function usedTypes(){const t=totals();const u=S.types.filter(k=>t[k]>0);return u.length?u:S.types.slice(0,1)}
const BOX=6;
function boxes(v){v=+v||0;if(!v)return'';const b=Math.floor(v/BOX),o=v%BOX;return o?`${b} ящ. + ${o} шт.`:`${b} ящ.`}
function rowText(r){const p=S.types.filter(k=>+r.n[k]>0).map(k=>`${+r.n[k]} шт. (${k})`);return p.length?p.join(', '):`0 шт. (${S.types[0]||''})`}

function text(){
const t=totals(),u=usedTypes();
const lines=[`Локація 📍: ${S.loc}`,`Дата📅: ${fmtDate(S.date)}`,`Зміна🧢: ${S.shift}`,'','Зібрано ✅:'];
S.rows.forEach((r,i)=>lines.push(`${i+1}. ${r.name} - ${rowText(r)}`));
lines.push('','✅ Усього зібрано за зміну');
u.forEach(k=>lines.push(`${k} - ${t[k]||0} шт.`));
lines.push('','✅ Усього запаковано за зміну');
u.forEach(k=>lines.push(`${k} - ${S.packed[k]===undefined||S.packed[k]===''?'___':S.packed[k]} шт.`));
return lines.join('\n');
}

function chips(list,cur,edit,kind){
return list.map((v,i)=>`<button class="chip${v===cur?' on':''}" data-k="${kind}" data-i="${i}">${esc(v)}${edit?' <span class="x">✕</span>':''}</button>`).join('');
}

function render(){
$('locs').innerHTML=S.locs.length?chips(S.locs,S.loc,editLoc,'loc'):'<span class="empty">Додай свою локацію — вона запам’ятається.</span>';
$('locAdd').hidden=!(editLoc||!S.locs.length);
$('editLoc').textContent=editLoc?'готово':'змінити список';
$('date').value=S.date;
$('dToday').classList.toggle('on',S.date===iso(new Date()));
$('dYest').classList.toggle('on',S.date===iso(new Date(Date.now()-864e5)));
$('shifts').innerHTML=chips(SHIFTS,S.shift,false,'shift');
$('types').innerHTML=chips(S.types,null,editType,'type');
$('editType').textContent=editType?'готово':'змінити список';
const inRows=new Set(S.rows.map(r=>r.name));
$('roster').innerHTML=S.roster.length?S.roster.map((v,i)=>`<button class="chip${inRows.has(v)?' added':''}" data-k="ppl" data-i="${i}">${editPpl?'':(inRows.has(v)?'✓ ':'+ ')}${esc(v)}${editPpl?' <span class="x">✕</span>':''}</button>`).join(''):'<span class="empty">Додай людей один раз — далі просто натискай на ім’я.</span>';
$('editPpl').textContent=editPpl?'готово':'змінити список';
$('rows').innerHTML=S.rows.length?S.rows.map((r,i)=>`<div class="w"><div class="wh"><span>${i+1}. ${esc(r.name)}</span><button data-del="${i}" aria-label="Прибрати">✕</button></div>
${S.types.map(k=>{const t=esc(k);return`<div class="tl">${t}</div><div class="cnt"><button class="pm" data-add="${i}" data-t="${t}" data-v="-6">−6</button><button class="pm" data-add="${i}" data-t="${t}" data-v="-1">−1</button><input inputmode="numeric" data-n="${i}" data-t="${t}" value="${esc(r.n[k]??'')}" placeholder="0" aria-label="Кількість, ${t}"><button class="pm" data-add="${i}" data-t="${t}" data-v="1">+1</button><button class="pm" data-add="${i}" data-t="${t}" data-v="6">+6</button><span class="bx" data-bx="${i}|${t}">${boxes(r.n[k])}</span></div>`}).join('')}</div>`).join(''):'<span class="empty">Натисни на ім’я у списку працівників вище.</span>';
renderTotals();
}
function renderTotals(){
const t=totals(),u=usedTypes();
$('totals').innerHTML='<div class="tot">'+u.map(k=>`<span>Зібрано</span><span>${esc(k)}</span><b>${t[k]||0} шт.<br><small style="font-size:13px;font-weight:500;color:var(--mute)">${boxes(t[k])}</small></b>
<span>Запаковано</span><button class="link" data-same="${esc(k)}">= як зібрано</button><input inputmode="numeric" data-p="${esc(k)}" value="${esc(S.packed[k]??'')}" placeholder="шт.">`).join('')+'</div>';
$('out').textContent=text();save();
}

document.addEventListener('click',e=>{
const b=e.target.closest('button');if(!b)return;
const k=b.dataset.k,i=+b.dataset.i;
if(k==='loc'){if(editLoc){const v=S.locs.splice(i,1)[0];if(S.loc===v)S.loc='';}else S.loc=S.loc===S.locs[i]?'':S.locs[i];}
else if(k==='shift')S.shift=SHIFTS[i];
else if(k==='type'){if(!editType)return;if(S.types.length>1){const v=S.types.splice(i,1)[0];delete S.packed[v];S.rows.forEach(r=>delete r.n[v]);}}
else if(k==='ppl'){const n=S.roster[i];if(editPpl)S.roster.splice(i,1);else{const j=S.rows.findIndex(r=>r.name===n);if(j>=0)S.rows.splice(j,1);else S.rows.push({name:n,n:{}});}}
else if(b.dataset.del!==undefined)S.rows.splice(+b.dataset.del,1);
else if(b.dataset.add!==undefined){const r=S.rows[+b.dataset.add],t=b.dataset.t;r.n[t]=Math.max(0,(+r.n[t]||0)+(+b.dataset.v));}
else if(b.dataset.same!==undefined){S.packed[b.dataset.same]=totals()[b.dataset.same]||0;renderTotals();return}
else return;
render();
});
document.addEventListener('input',e=>{
const el=e.target;
if(el.dataset.n!==undefined){S.rows[+el.dataset.n].n[el.dataset.t]=el.value.replace(/\D/g,'');const bx=el.parentNode.querySelector('.bx');if(bx)bx.textContent=boxes(el.value);renderTotals();}
else if(el.dataset.p!==undefined){S.packed[el.dataset.p]=el.value.replace(/\D/g,'');$('out').textContent=text();save();}
});
$('date').addEventListener('change',e=>{S.date=e.target.value;render()});
$('dToday').onclick=()=>{S.date=iso(new Date());render()};
$('dYest').onclick=()=>{S.date=iso(new Date(Date.now()-864e5));render()};
$('editLoc').onclick=()=>{editLoc=!editLoc;render()};
$('editPpl').onclick=()=>{editPpl=!editPpl;render()};
$('editType').onclick=()=>{editType=!editType;render()};
function addTo(inp,list,after){const v=$(inp).value.trim();if(!v)return;if(!list.includes(v))list.push(v);$(inp).value='';after&&after(v);render()}
$('locBtn').onclick=()=>addTo('locIn',S.locs,v=>S.loc=v);
$('pplBtn').onclick=()=>addTo('pplIn',S.roster,v=>{if(!S.rows.some(r=>r.name===v))S.rows.push({name:v,n:{}})});
$('typeBtn').onclick=()=>addTo('typeIn',S.types);
[['locIn','locBtn'],['pplIn','pplBtn'],['typeIn','typeBtn']].forEach(([a,b])=>$(a).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$(b).click()}}));
$('reset').onclick=()=>{S.rows=[];S.packed={};S.date=iso(new Date());render();window.scrollTo(0,0)};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
$('share').onclick=async()=>{const s=text();if(window.Android){try{Android.share(s);return}catch(e){}}if(navigator.share){try{await navigator.share({text:s})}catch(e){}}else $('copy').click()};
if(!window.Android&&!navigator.share){$('share').hidden=true;$('copy').textContent='Скопіювати звіт';$('copy').className='btn'}
$('copy').onclick=async()=>{
const s=text();
if(window.Android){try{Android.copy(s);toast('Скопійовано ✓');return}catch(e){}}
try{await navigator.clipboard.writeText(s);toast('Скопійовано ✓')}
catch(e){const r=document.createRange();r.selectNodeContents($('out'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);
try{document.execCommand('copy');toast('Скопійовано ✓')}catch(_){toast('Виділено — скопіюй вручну')}}
};
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
